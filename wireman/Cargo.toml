[package]
name = "wireman"
version = "0.4.0"
edition = "2021"
authors = ["preiter <phil.reiter93@gmail.com>"]
description = "A TUI based gRPC client"
repository = "https://github.com/preiter93/wireman"
keywords = ["wireman", "ratatui", "grpc", "client", "app"]
readme = "../README.md"
license = "MIT"
rust-version = "1.89"

[features]
default = ["mcp"]
# The `wireman mcp` server for AI agents.
mcp = ["dep:wireman_mcp"]

[dependencies]

wireman_core = { package = "wireman-core", version = "^0.3.0" }
wireman_config = { package = "wireman-config", version = "^0.7.0" }
wireman_logger = { package = "wireman-logger", version = "0.1" }
wireman_theme = { package = "wireman-theme", version = "^0.3.4" }
wireman_event_handler = { package = "wireman-event-handler", version = "^0.3.1" }
wireman_mcp = { package = "wireman-mcp", version = "^0.1.0", optional = true }

# tui-widget-list = { version = "0.15", path = "../../tui-widget-list" }
tui-widget-list = { version = "0.15" }
edtui = { version = "0.11", default-features = false, features = ["mouse-support", "system-editor"] }
# edtui = { package = "edtui", path = "../../edtui", version = "0.11", default-features = false, features = ["mouse-support", "system-editor"] }
# edtui = { version = "0.11", git = "https://github.com/preiter93/edtui", branch = "tabs" }
crossterm = { version = "0.29", features = ["events", "event-stream"] }
ratatui = { package = "ratatui", version = "0.30", features = ["unstable"] }
serde_json = "1.0"
http = "1"
arboard = { version = "3.4.1", features = ["wayland-data-control"] }
tokio = { version = ">=1.48", features = ["rt", "macros"] }
futures = "0.3"
